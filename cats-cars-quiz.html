        <header>
          <h1>CATS &amp; CARS Exam Practice</h1>
          <p>Understanding CATS &amp; CARS · CPL / ATP / IF</p>
        </header>
        <div class="card">
          <p style="margin:0 0 1rem;color:var(--grey-300);font-size:0.95rem;">Choose a topic. Each attempt draws ${QUESTIONS_PER_QUIZ} random questions with no repeats within the test.</p>
          ${buttons}
        </div>
        <footer>CATS &amp; CARS Exam Practice · Random ${QUESTIONS_PER_QUIZ} questions per attempt</footer>
      `;
      document.querySelectorAll(".bank-btn").forEach(btn => {
        btn.addEventListener("click", () => startQuiz(btn.dataset.id));
      });
    }

    function startQuiz(bankId) {
      currentBank = QUESTION_BANKS.find(b => b.id === bankId);
      const pool = shuffle(currentBank.questions);
      quizQuestions = pool.slice(0, Math.min(QUESTIONS_PER_QUIZ, pool.length));
      currentIndex = 0;
      userAnswers = new Array(quizQuestions.length).fill(null);
      showResults = false;
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizQuestions[currentIndex];
      const answered = userAnswers[currentIndex] !== null;
      const pct = ((currentIndex) / quizQuestions.length) * 100;
      const opts = q.options.map((opt, i) => {
        let cls = "opt";
        if (answered) {
          if (i === q.answer) cls += " correct";
          else if (i === userAnswers[currentIndex]) cls += " wrong";
        } else if (userAnswers[currentIndex] === i) cls += " selected";
        return `<button class="${cls}" data-i="${i}" ${answered ? "disabled" : ""}>${String.fromCharCode(65 + i)}. ${opt}</button>`;
      }).join("");
      app.innerHTML = `
        <header>
          <h1>${currentBank.name}</h1>
          <p>Question ${currentIndex + 1} of ${quizQuestions.length}</p>
        </header>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="card">
          <div class="q-meta">${currentBank.name}</div>
          <div class="q-text">${q.q}</div>
          ${opts}
          <div class="btn-row">
            <button class="btn btn-secondary" id="btn-back" ${currentIndex === 0 ? "disabled" : ""}>Back</button>
            <button class="btn" id="btn-next" ${!answered ? "disabled" : ""}>${currentIndex === quizQuestions.length - 1 ? "Finish" : "Next"}</button>
            <button class="btn btn-secondary" id="btn-home">Topics</button>
          </div>
        </div>
      `;
      document.querySelectorAll(".opt").forEach(btn => {
        btn.addEventListener("click", () => {
          if (userAnswers[currentIndex] !== null) return;
          userAnswers[currentIndex] = parseInt(btn.dataset.i, 10);
          renderQuestion();
        });
      });
      document.getElementById("btn-back").addEventListener("click", () => {
        if (currentIndex > 0) { currentIndex--; renderQuestion(); }
      });
      document.getElementById("btn-next").addEventListener("click", () => {
        if (currentIndex < quizQuestions.length - 1) {
          currentIndex++;
          renderQuestion();
        } else {
          showResultsScreen();
        }
      });
      document.getElementById("btn-home").addEventListener("click", startScreen);
    }

    function showResultsScreen() {
      let correct = 0;
      quizQuestions.forEach((q, i) => { if (userAnswers[i] === q.answer) correct++; });
      const pct = Math.round((correct / quizQuestions.length) * 100);
      const review = quizQuestions.map((q, i) => {
        const ok = userAnswers[i] === q.answer;
        const your = userAnswers[i] !== null ? q.options[userAnswers[i]] : "(no answer)";
        return `<div class="review-item ${ok ? "ok" : "bad"}">
          <div class="review-q">${i + 1}. ${q.q}</div>
          <div class="review-a">Your answer: ${your}</div>
          <div class="review-a">Correct: ${q.options[q.answer]}</div>
        </div>`;
      }).join("");
      app.innerHTML = `
        <header>
          <h1>${currentBank.name} — Results</h1>
        </header>
        <div class="card">
          <div class="score-big">${pct}%</div>
          <div class="score-label">${correct} / ${quizQuestions.length} correct</div>
          <div class="btn-row" style="justify-content:center;">
            <button class="btn" id="btn-retry">Retry topic</button>
            <button class="btn btn-secondary" id="btn-home2">All topics</button>
          </div>
        </div>
        <div class="card">
          <h2 style="margin:0 0 1rem;font-size:1.1rem;">Review</h2>
          ${review}
        </div>
        <footer>CATS &amp; CARS Exam Practice</footer>
      `;
      document.getElementById("btn-retry").addEventListener("click", () => startQuiz(currentBank.id));
      document.getElementById("btn-home2").addEventListener("click", startScreen);
    }

    startScreen();
  </script>
</body>
</html>
